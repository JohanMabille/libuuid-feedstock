schema_version: 1

context:
  version: "2.42.4"

recipe:
  name: libuuid
  version: ${{ version }}

source:
  # use github mirror to make it easier for bot to scrape for new versions
  url: https://github.com/util-linux/util-linux/archive/refs/tags/v${{ version }}.tar.gz
  sha256: e1d38037dab761a2d39114d88a6744ffd5a4576efa29fe41e1dfbd8453891fe7
  patches:
    - darwin_libtoolize.patch

build:
  number: 1
  skip: win

outputs:
  # Build once (shared + static), then split the installed files into two packages.
  - staging:
      name: libuuid-build
    build:
      script: build.sh
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - python 3.12.*
        - autoconf
        - automake
        - bison
        - flex
        - gettext-tools
        - libiconv
        - libtool
        - gnuconfig
        - make

  - package:
      name: libuuid
    inherit: libuuid-build
    build:
      files:
        - include/uuid/
        - lib/libuuid.so*
        - lib/libuuid*.dylib
        - lib/pkgconfig/uuid.pc
    requirements:
      run_exports:
        - ${{ pin_subpackage('libuuid') }}
    tests:
      - package_contents:
          include:
            - uuid/uuid.h
          lib:
            - uuid
          files:
            not_exists:
              - lib/libuuid.a

  - package:
      name: libuuid-static
    inherit: libuuid-build
    build:
      files:
        - lib/libuuid.a
    requirements:
      run:
        # headers and pkg-config file live in libuuid
        - ${{ pin_subpackage('libuuid', exact=True) }}
    tests:
      - package_contents:
          files:
            - lib/libuuid.a

about:
  license: BSD-3-Clause
  license_file: COPYING
  summary: Portable uuid C library.
  homepage: http://sourceforge.net/projects/libuuid/

extra:
  feedstock-name: libuuid
  recipe-maintainers:
    - hmaarrfk
    - ocefpaf
